[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "paralog-forecast"
version = "0.1.0"
description = "Reusable WGD/paralog enrichment + forecastability assay accompanying the New Phytologist paper on the crop-trait paralog reservoir."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "scikit-learn>=1.3",
]

[tool.setuptools]
packages = ["paralog_forecast"]
